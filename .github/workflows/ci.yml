name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore Asisya.slnx

      - name: Check code style
        run: dotnet format Asisya.slnx --verify-no-changes --no-restore --exclude src/Asisya.Infrastructure/Migrations

      - name: Build
        run: dotnet build Asisya.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Asisya.slnx --no-build -c Release

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t asisya-api:ci .